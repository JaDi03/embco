[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.30"
evm_version = "prague" # Arc targets the Prague hard fork
optimizer = true
optimizer_runs = 200

[fuzz]
runs = 1000

[invariant]
runs = 256
depth = 64
fail_on_revert = false

[fmt]
line_length = 120

# RPC is the variable arc-canteen exports; without Canteen, set it in .env (see .env.example)
[rpc_endpoints]
arc_testnet = "${RPC}"
