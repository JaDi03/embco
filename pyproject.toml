[project]
name = "embco"
version = "0.1.0"
description = "Pluggable payables agent for businesses that already run ERPNext"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=1.0",
    "cryptography>=43",
    "eth-abi>=5",
    "eth-account>=0.13",
    "eth-utils>=5",
    "fastapi>=0.115",
    "httpx>=0.27",
    "pydantic>=2.7",
    "uvicorn>=0.30",
]

[project.scripts]
embco = "services.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent", "services"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = [".", "tests"]
extend-exclude = ["contracts", "dashboard"]  # Solidity with its own vendored tools; JavaScript

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
