[project]
name = "embco"
version = "0.1.0"
description = "Pluggable payables agent for businesses that already run ERPNext"
requires-python = ">=3.12"
dependencies = [
    "eth-account>=0.13",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
embco = "embco.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/embco"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
